# 새벽 배치 — 수집 → 평가 → 브리핑 (ADR 0004).
# 앞 단계가 실패해도 뒤 단계는 DB에 있는 것으로 돌고, 하나라도 실패하면 잡이 실패로 끝난다(ADR 0003).
# 저장소가 공개라 이 로그도 공개다. 사용자 정보(이메일·관심사 이름)를 로그에 찍지 않는다.
name: pipeline

on:
  schedule:
    # 03:17 KST. GitHub cron은 UTC이고, 정각은 몰려서 지연이 크다
    - cron: '17 18 * * *'
  workflow_dispatch:

# 두 실행이 겹치지 않게. 각 서비스의 advisory lock이 있지만 비용이 드는 잡을 두 번 띄울 이유가 없다
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 코드가 기대하는 스키마로 맞춘 뒤 돈다. 이미 적용된 마이그레이션은 건너뛴다
      - run: pnpm db:migrate
      - run: pnpm pipeline:run
